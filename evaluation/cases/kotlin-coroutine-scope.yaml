id: kotlin-coroutine-scope
bug_description: "Kotlin GlobalScope.launch used instead of viewModelScope in Android app, causing coroutine to continue after Activity destroyed and updating stale UI"
error_log: |
  E/AndroidRuntime: FATAL EXCEPTION: DefaultDispatcher-worker-1
      Process: com.example.app, PID: 48291
      kotlin.UninitializedPropertyAccessException: lateinit property binding has not been initialized
          at com.example.app.ui.OrderDetailFragment.updateTotals(OrderDetailFragment.kt:89)
