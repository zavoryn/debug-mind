<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="brain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
    <linearGradient id="node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#533483"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="120" height="120" rx="20" fill="url(#bg)"/>
  <!-- Bug icon (ladybug body) -->
  <ellipse cx="60" cy="65" rx="28" ry="32" fill="url(#brain)"/>
  <!-- Bug head -->
  <circle cx="60" cy="33" r="10" fill="#333"/>
  <!-- Bug line -->
  <line x1="60" y1="33" x2="60" y2="97" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Bug dots -->
  <circle cx="47" cy="55" r="5" fill="#1a1a2e" opacity="0.6"/>
  <circle cx="73" cy="55" r="5" fill="#1a1a2e" opacity="0.6"/>
  <circle cx="47" cy="75" r="5" fill="#1a1a2e" opacity="0.6"/>
  <circle cx="73" cy="75" r="5" fill="#1a1a2e" opacity="0.6"/>
  <!-- Brain/Memory nodes (connected dots) -->
  <circle cx="28" cy="40" r="4" fill="url(#node)"/>
  <circle cx="92" cy="40" r="4" fill="url(#node)"/>
  <circle cx="22" cy="85" r="4" fill="url(#node)"/>
  <circle cx="98" cy="85" r="4" fill="url(#node)"/>
  <!-- Connection lines -->
  <line x1="28" y1="40" x2="42" y2="50" stroke="#533483" stroke-width="1.5" opacity="0.7"/>
  <line x1="92" y1="40" x2="78" y2="50" stroke="#533483" stroke-width="1.5" opacity="0.7"/>
  <line x1="22" y1="85" x2="40" y2="78" stroke="#533483" stroke-width="1.5" opacity="0.7"/>
  <line x1="98" y1="85" x2="80" y2="78" stroke="#533483" stroke-width="1.5" opacity="0.7"/>
  <!-- Antenna -->
  <line x1="55" y1="25" x2="42" y2="15" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <line x1="65" y1="25" x2="78" y2="15" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  <circle cx="42" cy="14" r="3" fill="#e94560"/>
  <circle cx="78" cy="14" r="3" fill="#e94560"/>
</svg>
