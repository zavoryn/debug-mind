[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "debug-mind"
version = "0.1.0"
description = "An AI-powered bug diagnosis agent with experiential memory — learns from every bug it fixes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "DebugMind Contributors" }]
keywords = ["ai", "debugging", "agent", "rag", "mcp", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.0",
    "click>=8.0",
    "rich>=13.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "filelock>=3.12",
    "tenacity>=8.2",
]

[project.optional-dependencies]
# Default backend is pure-Python SQLite (no extra deps).
# Install 'chroma' for the ChromaDB backend (better HNSW indexing at scale).
chroma = ["chromadb>=0.6.0,<0.7"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "tomli>=2.0; python_version < '3.11'"]
observability = ["opentelemetry-api>=1.20"]
web = ["gradio>=4.0", "pyvis>=0.3"]
openai = ["openai>=1.0"]
embeddings = ["openai>=1.0", "voyageai>=0.3", "sentence-transformers>=3.0"]
all = [
    "chromadb>=0.6.0,<0.7",
    "gradio>=4.0",
    "pyvis>=0.3",
    "opentelemetry-api>=1.20",
    "openai>=1.0",
    "voyageai>=0.3",
    "sentence-transformers>=3.0",
]

[project.scripts]
debug-mind = "debug_mind.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/debug_mind", "evaluation"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
